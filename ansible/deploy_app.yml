---
# Regle : la production (app-prod1) ne recoit que la branche main (verifie dans le job Jenkins todolist-deploy)
- name: Deploiement de la todolist
  hosts: my_infra
  become: true
  vars:
    app_repo: https://github.com/Aurlem0110/to-do-list-unsecure.git
    app_branch: main
  tasks:
    - name: Installer les paquets systeme
      ansible.builtin.apt:
        name:
          - git
          - python3
          - python3-venv
          - python3-pip
        state: present
        update_cache: true

    - name: Recuperer les sources depuis GitHub
      ansible.builtin.git:
        repo: "{{ app_repo }}"
        dest: /opt/todolist
        version: "{{ app_branch }}"
        force: true

    - name: Installer les dependances Python dans un venv
      ansible.builtin.pip:
        name:
          - django
          - gunicorn
          - pyyaml
        virtualenv: /opt/todolist/venv
        virtualenv_command: python3 -m venv

    - name: Autoriser toutes les IP dans ALLOWED_HOSTS
      ansible.builtin.lineinfile:
        path: /opt/todolist/todo/settings.py
        regexp: '^ALLOWED_HOSTS'
        line: "ALLOWED_HOSTS = ['*']"

    - name: Appliquer les migrations
      ansible.builtin.command:
        cmd: /opt/todolist/venv/bin/python manage.py migrate
        chdir: /opt/todolist

    - name: Creer le service systemd todolist
      ansible.builtin.copy:
        dest: /etc/systemd/system/todolist.service
        owner: root
        group: root
        mode: "0644"
        content: |
          [Unit]
          Description=Todolist (Gunicorn)
          After=network.target

          [Service]
          WorkingDirectory=/opt/todolist
          ExecStart=/opt/todolist/venv/bin/gunicorn todo.wsgi:application --bind 0.0.0.0:80
          Restart=on-failure

          [Install]
          WantedBy=multi-user.target

    - name: Recharger systemd
      ansible.builtin.systemd:
        daemon_reload: true

    - name: Activer au boot et (re)demarrer le service
      ansible.builtin.systemd:
        name: todolist
        enabled: true
        state: restarted
